<!DOCTYPE html>
<html lang="en" data-theme="dark">
{{head}}
<body>
{{header}}
<main id="main-content" class="page">
  <section class="section">
    <div class="container narrow">
      <a href="../projects.html" class="blog-back-link">&larr; Back to projects</a>

      {{images}}

      <div class="post-header">
        <div class="mini-meta" style="margin-bottom:0.5rem">{{tags}}</div>
        <h1>{{title}}</h1>
        <p class="lead">{{description}}</p>
      </div>

      <div class="post-body">{{body}}</div>

      {{link}}
    </div>
  </section>
</main>
{{footer}}
{{scripts}}
</body>
</html>
