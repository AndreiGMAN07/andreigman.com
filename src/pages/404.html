<!DOCTYPE html>
<html lang="en" data-theme="dark">
{{head}}
<body>
{{header}}
<main id="main-content">
  <section class="section">
    <div class="container narrow center-page">
      <div class="error-illustration" aria-hidden="true">
        <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="80" cy="80" r="70" stroke="#257e43" stroke-width="3" fill="none" stroke-dasharray="440" stroke-dashoffset="440">
            <animate attributeName="stroke-dashoffset" from="440" to="0" dur="1.2s" fill="freeze" />
          </circle>
          <text x="80" y="92" text-anchor="middle" font-size="48" font-weight="800" fill="#257e43" font-family="Inter, Arial, sans-serif">404</text>
          <circle cx="80" cy="80" r="55" stroke="#36a85d" stroke-width="2" fill="none" stroke-dasharray="345" stroke-dashoffset="345" opacity="0.5">
            <animate attributeName="stroke-dashoffset" from="345" to="0" dur="1.5s" begin="0.3s" fill="freeze" />
          </circle>
        </svg>
      </div>
      <p class="eyebrow">Oops</p>
      <h1>Page not found</h1>
      <p class="lead">The page you're looking for doesn&rsquo;t exist or has moved.</p>
      <div class="hero-actions" style="margin-top: 2rem;">
        <a href="index.html" class="btn btn-primary">Go home</a>
        <a href="blog.html" class="btn btn-secondary">Read blog</a>
      </div>
      <p class="section-cta" style="margin-top: 1.5rem;">
        <a href="#" class="text-link" onclick="history.back(); return false;">&larr; Go back</a>
      </p>
    </div>
  </section>
</main>
{{footer}}
{{scripts}}
</body>
</html>
