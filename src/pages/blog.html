<!DOCTYPE html>
<html lang="en" data-theme="dark">
{{head}}
<body>
{{header}}
<main id="main-content">
  <section class="section">
    <div class="container">

      <div class="section-head">
        <p class="eyebrow">Blog</p>
        <h1>Thoughts, notes &amp; diary</h1>
        <p class="lead">A mix of personal reflections, ideas I'm exploring, things I'm learning, and random thoughts I don't want to lose.</p>
      </div>

      <div class="blog-tags" id="blogTags">
        <span class="blog-sort-wrap">
          <select id="blogSort" aria-label="Sort posts">
            <option value="date-desc">Newest first</option>
            <option value="date-asc">Oldest first</option>
            <option value="title-asc">Title A&ndash;Z</option>
            <option value="title-desc">Title Z&ndash;A</option>
          </select>
        </span>
      </div>

      <div class="blog-layout">
        <div class="grid-3" id="blogList" aria-live="polite"></div>

        <aside class="blog-sidebar card" aria-label="Recent posts">
          <h3>Recent posts</h3>
          <ul class="clean-list" id="recentPosts"></ul>
        </aside>
      </div>

    </div>
  </section>
</main>
{{footer}}
{{scripts}}
</body>
</html>
